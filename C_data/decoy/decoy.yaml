    <meta name="description" content="아낌없는 성원으로 아산제터먹이사회적협동조합 제품을 구매해 주신 소비자분들께 진심으로감사드립니다.그동안 저희 제품은 농민 조합원님들의 생산비 보장을 최우선의 가치로 삼으며 경영을 해 왔습니다.그러나 수입밀과의 가격 경쟁을 피할 수 없어 수 차례의 물가 인상에도 불구하고 최대한 가격 상승을억제하며 10년전의 판매가격을 유지해 왔습니다만 토종밀 사업의 적자폭을 더는 유지할 수 없게 되어&nbsp;소비자분들께 송구스럽기 그지없지만 오는 8월25일부로 판매가격을 인상하게 되었습니다.아산제터먹이사회적협동조합은 보다 좋은 먹거리로 보답하고자 토종 종자의 가치와 농부님들의 노동의가치 실현을 위하여 최선을 다하겠습니다.송구스럽지만 별첨된 가격으로 주문해 주시면 감사하겠습니다.아산제터먹이사회적협동조합 이사장 장명진&nbsp;&nbsp; &nbsp; &nbsp;&nbsp;&nbsp; &nbsp;(앉은뱅이밀가루 500g 3,500원)&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(앉은뱅이밀가루 500g 3,000원)&nbsp; &nbsp; &nbsp;&nbsp;&nbsp; &nbsp; (오방국수치자 300g 4,000원)&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(오방국수천년초 300g 4,000원)&nbsp; &nbsp; &nbsp;&nbsp;&nbsp; (오방국수콩나물 300g 4,000원)&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(오방국수클로렐라 300g 4,000원)      &nbsp;&nbsp; &nbsp;(오방국수흑미 300g 4,000원) &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(오방국수세트 22,000원)"/>'
