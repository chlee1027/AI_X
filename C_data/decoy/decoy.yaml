  html: "<p>\n\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n\n산업통상자원부 공고 제2025-165호\
    \ \n2025년도 월드클래스플러스사업 신규지원 공고 \n- 월드클래스 후보기업 (R&amp;D 지원) - \n세계적 수준의 중견기업 육성을 위하여 산업통상자원부에서 추진하고 있는 ｢월드클래스플러스사업｣ - 월드클래스\
    \ 후보기업 연구개발 지원사업(R&amp;D) 의 2025년도 신규지원을 다음과 같이 공고하오니 수행하고자 하는 자는 신청하여 주시기 바랍니다. \n* 본 공고는 기 공고된 공고번호 제2025-048호의 연장 공고로서,\
    \ 최초 공고일(‘25.1.20) 이후 신청서를 접수한 모든 신청과제를 통합하여 평가‧선정 예정임을 참고하시기 바랍니다. \n2025년 2월 21일\n산업통상자원부장관\n&lt; 목 차 &gt;\n1. 사업개요\n\
    1-1. 사업 목적\n1-2. 사업 개요\n1-3. 지원대상분야\n1-4. 지원내용\n2. 사업추진체계\n3. 지원분야 및 신청자격 등\n3-1. 지원분야\n3-2. 신청자격\n3-3. 지원제외 처리기준\n4.\
    \ 평가 절차 및 기준\n4-1. 평가절차 \n4-2. 평가기준\n5. 연구개발비 지원기준 및 기술료 징수기준\n5-1. 연구개발비 지원기준 \n5-2. 기술료 징수 여부 및 방법\n5-3. 연구개발비 산정 시\
    \ 유의사항\n6. 근거법령 및 규정\n7. 신청방법 \n8. 제출서류\n9. 지정기간 및 지원내용\n10. 기타 유의 사항\n11. 사업설명회 및 문의처 등\n1\n사업개요\n1-1. 사업 목적\nㅇ 성장의지와\
    \ 기술잠재력을 갖춘 중견기업 및 중견기업 후보기업을 집중 지원하여, 중견기업의 성장 촉진 및 글로벌 경쟁력 강화\nㅇ 특정기업 의존을 벗어나 독자적 신시장 진출을 희망하는 중견기업 및 중견기업 후보기업의 미래\
    \ 전략 기술 개발 지원 \n1-2. 사업 개요 \n구분\n월드클래스 후보기업* 연구개발 지원사업 \n지원 규모\n- 10개 내외 \n지원\n내용\nR&amp;D\n- 기업별 3~4년간 국비 30억원 내외 지원(최대\
    \ 50억원)\n* 연간 7.5억원~12.5억원 (연평균 7.5억 원 내외) \n* 과제당 예산은 연구개발계획서 평가 후 조정될 수 있음 \n지원 기간 : 최대 4년 \n비R&amp;D\n(지원시책)\n24개 지원시책\
    \ 지원\n* 법률, 금융, 인력, 수출, 컨설팅 등 기업 맞춤형 해외시장 진출 지원 \n지원 기간 : 최대 5년(변동 가능)\n신청대상\n주관연구개발기관 : 중견기업 또는 중견기업 후보기업 \n* 지원대상 신청자격\
    \ 및 지원제외 처리기준은 ‘3-2. 신청자격’, ‘3-3. 지원제외 처리기준’ 참조 \n신청조건\n- 조건 1과 2 모두 충족 \n* 충족 여부는 [붙임2] 월드클래스플러스 신청요건 확인을 활용하여 확인 가능\
    \ \n** 기업사정에 따라 2023년까지의 실적 또는 2024년 가결산 자료기준 작성 선택가능 \n조건 1 \n’23년 결산 재무제표 또는 ‘24년 추정 재무제표 기준 \n매출액 1조원 미만의 중견기업(매출액\
    \ 하한선 無) 또는 \n매출액 700억원~1조원의 중견기업 후보기업(지원가능 기준 별도 有) \n조건 2 \n① \n’23년 결산 재무제표 또는 ‘24년 추정 재무제표 기준 \n직접 수출 비중 50% 미만이며,\
    \ \n② \n최근 3년 평균 R&amp;D 집약도 1% 이상 \n제출 서류 \n① 성장전략서 \n② 연구개발계획서 \n③ 신청양식 등 \n* 월드클래스 후보기업이란 월드클래스 기업이 아닌 내수 중심 중견기업 및\
    \ 중견기업 후보기업을 세계적 수준의 기업으로 육성하기 위해 선정된 기업을 말함 \n1-3. 지원대상 분야\nㅇ 중점지원분야(중견 10대 핵심산업, 26개 품목) \n핵심산업\n유망품목\n핵심산업\n유망품목\n\
    반도체 디스플레이\n파워·시스템반도체\n에너지신산업\n수소 생산·저장 및 연료전지\n메모리소자 설계\n태양광·풍력부품·시스템\n차세대OLED장비·부품·소재\n스마트미터, ESS\n이차전지\n양극소재\n첨단제조\n\
    차세대 지능모듈·제어시스템\n고에너지 리튬전지\nAI제품·클라우드·서비스\n첨단바이오\n스마트 진단(ICT 융합 등)\nAI로봇\n협동로봇\n지능형 헬스케어\n서비스로봇\n바이오 의약·생체적합 소재\n항공·방산\n\
    드론·개인용 비행체(PAV)\n미래 모빌리티\n초소형·고효율·경량화 부품\n자율비행제어 시스템\n자율주행 설계·핵심부품\n경량화 항공부품\n모터, 인버터\n차세대정보통신\n무선 네트워크\n핵심소재\n극한환경 대응소재\n\
    보안기술\n바이오 소재\nSW개발 및 정보서비스\n* 전·후방 연관 산업 및 품목도 가능 \n* 품목 일치 여부는 성장전략서를 기준으로 판단하며, 분야평가(기술확보 분야)에서 평가\n* 평가를 통해 중점지원분야와의\
    \ 연관성이 미흡하다고 판단될 시 지원제외\n1-4. 지원 내용 \n구분\n월드클래스 후보기업\n지원내용\nR&amp;D\n지원규모①\n과제당 평균 7.5억원 내외/년 (최대 국비 12.5억원/년)\n구분\nTRACK\
    \ 1. 기술확보형\nTRACK 2. 글로벌특화형\n규모\n지원기간 : 3~4년(최대 4년) / 지원국비 : 30~50억원(최대 50억원)\n내용\n세계 최고수준 기술경쟁력 확보를 위한 중장기 대형 기술개발 중점\
    \ 지원\n해외시장 확대와 신규 거래선 창출을 위한 수출 사업화 기술개발 중점 지원\n※ 사업 신청 시 2가지 트랙 중 반드시 1가지 선택하여 신청\n(중복 지원 불가, 연구개발계획서 작성 시 신청 트랙에 맞춰\
    \ 중점 작성)\n지원과제\n10개 과제 내외 \n공모유형\n자유공모 \n지원기간②\n4년 이내 \n* 지원규모 및 지원기간은 신규과제 선정평가결과에 따라 조정될 수 있음\n① 정부의 예산 상황과 연구개발과제평가단\
    \ 결과에 따라 신청한 지원 금액 대비 정부지원연구개발비 감액 가능(2~4차년도 지원 금액 추후 평가 진행 후 감액 가능)\n② 협약기간(예정) : 1차년도(‘25년 4월∼12월, 9개월), 2차∼4차년도(1월∼12월,\
    \ 12개월) \n비R&amp;D\n▪인력, 수출, 컨설팅, 법률지원 등 기업 성장에 필요한 경영 지원\n[별표1] 월드클래스 셰르파 지원시책 참고\n▪월드클래스 후보기업 선정 후 5년차 점검을 통해 핵심 목표를\
    \ 충실히 이행하고 있거나, 목표 재설정, 성장전략 수정 등을 통한 지속 지원 필요성이 인정되는 기업은 추가 5년 연장하여 비R&amp;D 지원시책 지원 가능 \n2\n사업추진체계\n사업총괄\n산업통상자원부\n\
    전문기관\n한국산업기술진흥원\n지원기관\n월드클래스 셰르파\n수행기관(연구개발기관)\n월드클래스 후보기업\n···\n주관연구\n개발기관\n공동연구\n개발기관1\n공동연구\n개발기관2\n공동연구\n개발기관N\n월드클래스\n\
    후보기업\n(주관연구개발기관\n연구책임자)\n공동연구\n개발기관1\n(공동연구개발\n기관1책임자)\n공동연구\n개발기관2\n(공동연구개발\n기관2책임자)\n공동연구\n개발기관N\n(공동연구개발\n기관N책임자)\n\
    ※ 월드클래스 셰르파 : 월드클래스기업 및 월드클래스 후보기업의 성장 촉진을 위해 금융, 인력, 컨설팅, 법률 등을 지원하는 지원기관 협의체(별표1 참고)\n3\n지원분야 및 신청자격 등\n3-1. 지원분야\n\
    □ 과제 유형 - 추진체계\nㅇ일반형 과제:총 1개 과제로 구성되어 주관연구개발기관과 공동연구개발기관이 공동으로 수행하는 과제 \n- 주관연구개발기관이라 함은 해당 과제를 주관하여 수행하는 기관(기업 포함) \n\
    - 공동연구개발기관이라 함은 해당 과제에 참여하여 주관연구개발기관과 공동으로 과제를 수행하는 기관(기업 포함) \n□ 과제 유형 - 개발형태\nㅇ혁신제품형 과제 : 산업원천기술을 접목한 제품을 개발하는 과제의 유형\n\
    □ 과제 유형 - 공모형태\nㅇ 자유공모형 과제 : 주관연구개발기관에서 자유롭게 주제를 선정하여 신청하는 방식 \n- 중견기업 중점지원분야(10대 핵심산업, 26개 품목) 내 자유공모 \n3-2. 신청자격 \n\
    □ 주관연구개발기관(월드클래스 후보기업) – 중견기업 또는 중견기업 후보기업\n: 조건①과 조건② 모두 충족 시 신청가능\n- 조건①과 조건②의 재무제표 기준은 동일해야 함 \n＊ 매출, 수출비중, R&amp;D투자비율,\
    \ 매출액 증가율 등의 산정을 위한 재무제표란 개별 재무제표를 말함(연결 재무제표 기준 실적 불가) \n＊＊ 주관연구개발기관은 기업으로 접수 마감일 현재 법인사업자이어야 하며, 중견기업의 경우 한국중견기업연합회의\
    \ ‘중견기업확인서’를, 중견기업 후보기업의 경우 ‘중소기업 확인서’ 및 ‘최근 5년 재무제표’를 제출 \n(조건①) ’23년 결산 재무제표 또는 ‘24년 추정 재무제표1)기준 매출액 1조원 미만의 중견기업2)\
    \ 또는 매출액 700억원~1조원의 중견기업 후보기업3) \n＊ 중견기업 매출액 기준 하한선 無 \n1) 추정 재무제표는 미확정 재무제표이므로 ’25년 3월말까지 감사보고서를 제출하여 요건에 부합하지 않는 것이\
    \ 확인될 경우 선정을 취소함 \n2) ‘중견기업’이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」제2조 1호의 기업임 \n3) ‘중견기업 후보기업’이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」제2조\
    \ 2호의 기업임\n(조건②) ’23년 결산 재무제표 또는 ‘24년 추정 재무제표1) 기준 직접 수출비중 50% 미만이며, 최근 3년 평균 R&amp;D 집약도 1% 이상 \n1) 추정 재무제표는 미확정 재무제표이므로\
    \ ’25년 3월말까지 감사보고서를 제출하여 요건에 부합하지 않는 것이 확인될 경우 선정을 취소함 \n글로벌 지향성\n집중적 연구개발\n전년도 재무제표 기준 직접 수출 비중이 전체 매출액의 50% 미만 \nand\n\
    최근 3년간 매출액 대비 R&amp;D 투자 비율 1% 이상 \n* 직접 수출 : 직수출(한국무역협회 자료) \n✪ 23년 결산 재무제표 제출 시\n글로벌 지향성 ⇨ 23년 재무제표 기준 직접 수출비중이 전체 매출액의\
    \ 50% 미만\n집중적 연구개발 ⇨ 21, 22, 23년 매출액 대비 R&amp;D 투자 비율 1% 이상\n✪ 24년 추정 재무제표 제출 시\n글로벌 지향성 ⇨ 24년 재무제표 기준 직접 수출비중이 전체 매출액의\
    \ 50% 미만\n집중적 연구개발 ⇨ 22, 23, 24년 매출액 대비 R&amp;D 투자 비율 1% 이상 \n□ 공동연구개발기관\nㅇ 주관연구개발기관과 공동으로 사업을 수행하는 기관으로서 기업, 대학, 연구기관,\
    \ 연구조합, 사업자단체, 의료기관 등 「산업기술혁신촉진법」 제11조 제2항 및 같은 법 시행령 제11조, 「산업기술혁신사업 공통 운영요령」 제2조 제1항 제3호, 제4호 및 제4의2호, 9의2부터 9의5에 해당하는\
    \ 기관 \nㅇ 국외 소재 기관(기업, 대학 및 연구소 등)의 경우 공동연구개발기관으로 사업 참여 가능함 \n3-3. 지원제외 처리기준\n□ 아래의 경우에는 지원대상에서 제외함\nㅇ 기존 월드클래스기업(월드클래스300\
    \ 기업 포함)은 월드클래스 후보기업으로 신청불가 \n- 다만 월드클래스300 기업 중 R&amp;D 미지원 기업이 월드클래스 후보기업 자격 요건에 부합하는 경우 신청 가능 \n※ 선정취소나 효력정지 기업은 제외함\
    \ \nㅇ 접수마감일 현재 우수기술연구센터사업(ATC) 및 우수기업연구소육성사업(ATC+)을 수행 중인 기업은 ATC 또는 ATC+ 과제 종료 이후 신청 가능 \n※ 월드클래스플러스 사업과 우수기업연구소육성사업(ATC+)에\
    \ 동시에 신청할 수 없음 \nㅇ 성장전략서와 연구개발계획서 내용이 공고된 품목(1-3 참고)에 해당하지 않거나, 연구개발계획서 내용과 성장전략서의 내용이 부합하지 아니한 경우\nㅇ 주관연구개발기관, 공동연구개발기관,\
    \ 주관연구개발기관의 장, 공동연구개발기관의 장, 연구책임자가 접수 마감일 현재 국가연구개발사업에 참여제한을 받고 있는 경우\nㅇ 접수마감일 현재 연구개발기관(단, 비영리기관 및 공기업(공사)은 적용 예외), 연구개발기관의\
    \ 장(단, 공직자윤리법 제3조의2에 따라 공직유관단체로 지정된 기관의 장은 적용 예외), 연구책임자(공동연구책임자 제외)가 아래 사유에 해당하는 경우 \n- 선정평가일까지 연구개발기관 변경 등으로 사전지원제외\
    \ 사유를 해소할 경우 선정평가에 상정 가능(주관연구개발기관의 변경은 허용되지 않음) \n- 접수 마감일 이후 사전지원제외 기준에 해당하게 된 때에는 해당 연구개발과제의 선정을 취소할 수 있으며, 필요한 경우 연구개발과제평가단에서\
    \ 제외 여부를 심의할 수 있음\n※ 사전지원제외 기준은 붙임3 참고 \nㅇ 주관연구개발기관은 아래 사항에 해당될 경우 지원대상에서 제외 처리함\n- 공정거래 관련 : 접수마감일 기준 3년 이내 3회 이상 고발\
    \ 또는 과징금 처분을 받은 법인(단, 고발 및 과징금 동시에 받은 경우 1회로 처리), 최근 1년 이내 3회 이상 시정명령 처분을 받은 법인\n- 산업재해 관련 : 접수마감일 기준 3년 이내「산업안전보건법」제10조에\
    \ 따라 산업재해 등과 관련하여 명단이 공표된 사업장 \n- 임금체불 관련 : 최근 3년간「근로기준법」제43조의2에 따라 명단이 공개된 체불사업주가 속한 사업장\n- 형사처벌 관련 : 정부포상 업무지침(행정안전부)\
    \ 상 일반국민 포상 추천제한 중 형사처분 사항에 해당 기업 대표이사 또는 최대주주가 포함되는 경우\nㅇ ‘24년 가결산 실적으로 신청요건을 충족한 기업 중 최종 결산 결과에 따라 신청요건을 미충족한 경우 선정취소\
    \ 함 \nㅇ 신청과제의 주관연구개발기관이 접수 마감일 기준으로 주관연구개발기관으로서 동시에 수행하는 산업통상자원부 소관 국가연구개발사업 과제수가 아래 표의 기준 이상인 경우 (단, 산업기술혁신사업 공통 운영요령\
    \ 제20조제3항 제1호로부터 제8호의 어느 하나에 해당하는 과제는 예외로 함) \n주관연구개발기관 유형 (한계기업) \n연구개발과제 수 \n중견기업\n4개까지 수행 가능\n중소기업\n2개까지 수행 가능\n※ “한계기업”이란\
    \ 최근 3개 회계연도 말 결산 재무제표상 이자보상비율이 연속으로 1미만인 기업임\n※ “중견기업 후보기업”은 중소기업으로 간주함\n※ 다만, 한계기업에 해당하는 중소·중견기업의 기업신용평가등급 중 종합신용등급이나\
    \ 기술신용평가기관(TCB)의 기술신용평가등급이 ’BBB’이상인 경우 또는 사업개시일로부터 접수마감일까지 5년 미만인 기업의 경우 적용 제외 \n※ 산업기술혁신사업 공통 운영요령 제20조3항3호에 따라 월드클래스플러스프로젝트지원\
    \ 사업은 개수에 포함하지 않음 \n□ 다음의 경우는 지원대상에서 제외될 수 있음 \nㅇ 신청 연구개발과제가 해당사업의 기본목적과 부합되지 않은 경우\nㅇ 신청 연구개발과제의 기술개발 목표 및 내용이 기지원, 기개발된\
    \ 과제와 동일한 경우 \nㅇ 주관연구개발기관, 공동연구개발기관, 연구책임자 등이 접수마감일 현재 각종 보고서 제출, 기술료/정산금/환수금 납부 등 의무사항을 불이행하고 있는 경우\nㅇ 참여연구자가 국가연구개발사업\
    \ 참여율 및 참여 과제수 기준을 만족하지 못하는 경우 \n- 사업을 신청하는 참여연구자(연구책임자 포함)는 인건비계상률이 10% 이상이어야 하며(학생연구자는 제외) 동시에 수행하는 국가연구개발사업 연구개발과제가\
    \ 최대 5개 이내여야 하고, 그 중 연구책임자(세부연구책임자를 포함하되, 공동연구책임자는 제외)로서 동시에 수행하는 연구개발과제는 최대 3개 이내여야 함 \n- 단, 공통운영요령 제20조2항의 어느 하나에 해당하는\
    \ 과제는 동시에 수행하는 과제로는 반영하지 않을 수 있으나, 참여연구자의 인건비계상률 산정에는 포함함 \n․ 참여연구자(연구책임자 및 공동연구개발기관책임자도 포함)의 과제 참여율은 기관 기본사업(연구기관만 해당)에\
    \ 참여하는 비율을 포함하여 100%를 초과할 수 없으며, 정부출연연구기관, 특정연구기관, 전문생산기술연구소 등 인건비가 100% 확보되지 않는 기관에 소속된 연구원의 총 과제 참여율은 기관 기본사업을 포함하여\
    \ 130% 이내에서 산정 가능\nㅇ ‘청년의무채용’ 조건을 충족하지 않는 경우(주관/참여기업이 받는 총 정부지원연구개발비 5억원 당 1명 이상의 청년인력 채용)\nㅇ 연구책임자 및 공동연구개발기관책임자의 소속기관이\
    \ 신청기관과 상이한 경우(단, 소속기관장이 겸임 또는 겸직을 허가한 경우와 산업기술연구조합육성법에 따른 산업기술연구조합이 신청기관인 경우 및 기업에 근무하는 정부출연연구기관의 기업지원연구직은 예외)\nㅇ 안전관리형\
    \ 과제로 지정된 과제가 공통운영요령 제2조제1항40의3호에 따라 수립한 안전관리 계획이 미흡한 경우\nㅇ 국내 특정 대기업 납품비중 50% 이상인 기업 중 납품처 다각화 계획이 명확하지 않은 경우 또는 기 선정기업(월드클래스300기업\
    \ 포함)의 계열기업(지분관계 30% 이상) 중 계열기업 간 거래관계의 독립성이 인정되지 않는 경우에는 선정에서 제외될 수 있음\nㅇ 종합평가 대상 중 사모펀드, 외국계 기업 등이 최대주주 또는 경영상 주요주주인\
    \ 경우, 해당 기업의 장기 성장 지원 계획을 제출받고 평가에 반영 \n4\n평가 절차 및 기준\n4-1. 평가절차 \n시행계획 공고\n신청접수\n요건심사\n분야평가\n(성장전략서)\n현장확인\n(필요시)\n연구개발\n\
