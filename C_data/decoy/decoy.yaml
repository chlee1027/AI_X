  html: "<dl>\n                                                                    <dt>「제21회 전국 어린이 지도 그리기 대회」 공모 안내</dt>\n\
    \                                                                    <dd> 8월 18일(화)<strong class=\"red\">∼</strong>2026년\
    \ 10월 6일(화) 오후 6시까지 \nㅇ 작품주제: '일상생활의 지도'(Map In Everyday Life)\n \n- 세계지도를 상상력과 창의력으로 자유롭게 일상생활의 지도로 표현하세요!\nㅇ 응모방법 \n\
     \n- 개별 제출 또는 각 학교별 취합 제출(1인 1작품 한정) \n- 직접제출·등기·택배 등 접수기간 내에 도착분에 한함 \n* 등기 및 택배 발송 시 2026. 10. 6.(화) 소인분까지 유효합니다. \n\
    - 규격: A3(42㎝×30㎝, ※ 규격 엄수)\n- 제출처: 국토교통부 국토지리정보원 국립지도박물관 \n- 제출주소: (16517) 경기도 수원시 영통구 월드컵로 92, 국토지리정보원 \n※ 문의사항: 031-210-2667,\
    \ 2640\n- 작품 뒷면에 참가신청서를 부착해 제출\n붙 임\n  \n 공모전 참가신청서(작품 뒷면에 부착해 제출해주시기 바랍니다.)\n \n접수번호\n접수처 기재\n신 청 인\n성 명\n \n생 년 월 일\n\
     \n소 속\n초등학교     학년     반\n주 소\n □ 학교 :\n □ 자택 :\n(학교 또는 자택 중 한 곳으로 반드시 작성바랍니다.)\n전화번호\n □ 학교 :\n □ 자택 :\n(학교 또는 자택 중\
    \ 한 곳으로 반드시 작성바랍니다.)\n법정 대리인\n(필수 기재)\n성 명\n \n관 계\n \n연 락 처\n \n작 품 명\n작 품 설 명\n \n개인정보 제공\n및 활용동의\n「제21회 전국 어린이 지도 그리기\
    \ 대회」 공모전 참가 신청과 관련하여 아래와 같이 개인정보를 수집·이용에 대해 확인하고 동의합니다.\n \n1. 수집 항목: 성명, 생년월일, 소속학교, 주소, 전화번호\n2. 수집목적: 참가자격 확인, 작품\
    \ 접수·관리, 심사결과 안내, 시상품 발송\n3. 보유 및 이용 기간: 공모전 종료 후 3개월까지 보관 후 파기\n4. 동의 거부 시 참가신청이 제한될 수 있습니다.\n \n□동의함  □동의하지 않음\n신청인(법정대리인)\
    \ :               (인 또는 서명)\n출품작 저작권\n및 사용동의\n본인은 출품작과 관련하여 다음 사항에 동의합니다.\n \n1. 출품작은 본인이 직접 창작한 순수 창작물이며, 타인의 저작권을 침해하지\
    \ 않았음을 확인합니다.\n2. 출품작은 <strong class=\"red\">비</strong>영리 홍보 및 기록 목적으로 별도 협의 없이 사용될 수 있음에 동의합니다.\n \n□동의함  □동의하지 않음\n\
    신청인(법정대리인) :               (인 또는 서명)\n■ 입상자 발표\n \nㅇ 2026년 11월 중(홈페이지 게시 및 개별 통지 예정)\n \n■ 시상내역\n구 분\n인원\n시 상 명\n부 상\n\
    <strong class=\"red\">비</strong> 고\n대 상\n1명\n국토교통부장관상\n문화상품권\n30만원\n \n우수학교상\n1개교\n국토교통부장관상\n국토지리정보원\n제작상품\n응모작품이\n많은\
    \ 학교\n최우수상\n3명\n국토지리정보원장상\n문화상품권\n20만원\n1∼2학년, 1명\n3∼4학년, 1명\n5∼6학년, 1명\n우 수 상\n6명\n국토지리정보원장상\n문화상품권\n10만원\n1∼2학년, 2명\n\
    3∼4학년, 2명\n5∼6학년, 2명\n장 려 상\n12명\n국토지리정보원장상\n문화상품권\n5만원\n1∼2학년, 4명\n3∼4학년, 4명\n5∼6학년, 4명\n특 별 상\n5명\n(사)한국지도학회장상\n특별상품\n\
    학회에서 준<strong class=\"red\">비</strong> \n※ 대상 및 최우수상(3명 중 대상 수상 학년대 수상자 1명 제외) 입상 작품은 2027년 ‘바버라 페추닉 어린이 세계지도 경연대회’에 출품\
    \ 예정\n  \n■ 기타사항\nㅇ 기존 캐릭터, 만화, 게임, 영화 등을 모사·재현한 작품 및 세계지도를 그리지 않은 작품은 심사에서 제외합니다.\nㅇ 제출된 작품은 반환하지 않으며 입상작을 <strong class=\"\
    red\">비</strong>롯하여 제출한 작품에 대한 소유 및 이용권은 국토지리정보원에 귀속됩니다. \nㅇ 작품 응모에 소요되는 모든 <strong class=\"red\">비</strong>용은 응모자 부담이며,\
    \ 정해진 입상 외에는 상품·기념품 등은 지급하지 않습니다.\nㅇ 제출한 출품작은 접수 이후 수정이 불가합니다. \nㅇ 작품은 평평하고 두께가 5mm를 넘지 않아야 하며, 그림이 아닌 기타 입체 재료 등을 붙인\
    \ 작품은 접수하지 않습니다. \nㅇ 작품이 규격(A3, 42*30cm)을 초과하는 경우, 심사하지 않습니다. \nㅇ 심사내용은 공개하지 않으며 심사 결과에 대해 이의를 제기할 수 없습니다. \nㅇ 응모작은 온·오프라인을\
    \ 통해 불특정 다수에게 공개될 수 있습니다. \nㅇ 시상을 위하여 신분증, 통장사본 등 개인정보를 요구할 수 있으며, 이에 미동의 시 시상금 지급이 제한될 수 있습니다. \nㅇ 기타 자세한 사항 및 문의사항은\
    \ 우리원(031-210-2667, 2640)으로 문의하여 주시기 바랍니다.\n</dd>\n\n                                                                \
    \    <dd class=\"date\"><span>[박물관] &gt;게시판&gt;공지사항｜</span>\n                                                        \
    \                <span>\n\t\t\t\t\t\t\t\t\t2026-08-18</span>\n                                                       \
    \             </dd>\n                                                                </dl>"
  css: ''
