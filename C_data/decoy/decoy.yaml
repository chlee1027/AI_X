    \ 상 일반국민 포상 추천제한 중 형사처분 사항에 해당 기업 대표이사 또는 최대주주가 포함되는 경우\nㅇ ‘24년 가결산 실적으로 신청요건을 충족한 기업 중 최종 결산 결과에 따라 신청요건을 미충족한 경우 선정취소\
    \ 함 \nㅇ 신청과제의 주관연구개발기관이 접수 마감일 기준으로 주관연구개발기관으로서 동시에 수행하는 산업통상자원부 소관 국가연구개발사업 과제수가 아래 표의 기준 이상인 경우 (단, 산업기술혁신사업 공통 운영요령\
    \ 제20조제3항 제1호로부터 제8호의 어느 하나에 해당하는 과제는 예외로 함) \n주관연구개발기관 유형 (한계기업) \n연구개발과제 수 \n중견기업\n4개까지 수행 가능\n중소기업\n2개까지 수행 가능\n※ “한계기업”이란\
    \ 최근 3개 회계연도 말 결산 재무제표상 이자보상비율이 연속으로 1미만인 기업임\n※ “중견기업 후보기업”은 중소기업으로 간주함\n※ 다만, 한계기업에 해당하는 중소·중견기업의 기업신용평가등급 중 종합신용등급이나\
    \ 기술신용평가기관(TCB)의 기술신용평가등급이 ’BBB’이상인 경우 또는 사업개시일로부터 접수마감일까지 5년 미만인 기업의 경우 적용 제외 \n※ 산업기술혁신사업 공통 운영요령 제20조3항3호에 따라 월드클래스플러스프로젝트지원\
    \ 사업은 개수에 포함하지 않음 \n□ 다음의 경우는 지원대상에서 제외될 수 있음 \nㅇ 신청 연구개발과제가 해당사업의 기본목적과 부합되지 않은 경우\nㅇ 신청 연구개발과제의 기술개발 목표 및 내용이 기지원, 기개발된\
    \ 과제와 동일한 경우 \nㅇ 주관연구개발기관, 공동연구개발기관, 연구책임자 등이 접수마감일 현재 각종 보고서 제출, 기술료/정산금/환수금 납부 등 의무사항을 불이행하고 있는 경우\nㅇ 참여연구자가 국가연구개발사업\
    \ 참여율 및 참여 과제수 기준을 만족하지 못하는 경우 \n- 사업을 신청하는 참여연구자(연구책임자 포함)는 인건비계상률이 10% 이상이어야 하며(학생연구자는 제외) 동시에 수행하는 국가연구개발사업 연구개발과제가\
    \ 최대 5개 이내여야 하고, 그 중 연구책임자(세부연구책임자를 포함하되, 공동연구책임자는 제외)로서 동시에 수행하는 연구개발과제는 최대 3개 이내여야 함 \n- 단, 공통운영요령 제20조2항의 어느 하나에 해당하는\
    \ 과제는 동시에 수행하는 과제로는 반영하지 않을 수 있으나, 참여연구자의 인건비계상률 산정에는 포함함 \n․ 참여연구자(연구책임자 및 공동연구개발기관책임자도 포함)의 과제 참여율은 기관 기본사업(연구기관만 해당)에\
    \ 참여하는 비율을 포함하여 100%를 초과할 수 없으며, 정부출연연구기관, 특정연구기관, 전문생산기술연구소 등 인건비가 100% 확보되지 않는 기관에 소속된 연구원의 총 과제 참여율은 기관 기본사업을 포함하여\
    \ 130% 이내에서 산정 가능\nㅇ ‘청년의무채용’ 조건을 충족하지 않는 경우(주관/참여기업이 받는 총 정부지원연구개발비 5억원 당 1명 이상의 청년인력 채용)\nㅇ 연구책임자 및 공동연구개발기관책임자의 소속기관이\
    \ 신청기관과 상이한 경우(단, 소속기관장이 겸임 또는 겸직을 허가한 경우와 산업기술연구조합육성법에 따른 산업기술연구조합이 신청기관인 경우 및 기업에 근무하는 정부출연연구기관의 기업지원연구직은 예외)\nㅇ 안전관리형\
    \ 과제로 지정된 과제가 공통운영요령 제2조제1항40의3호에 따라 수립한 안전관리 계획이 미흡한 경우\nㅇ 국내 특정 대기업 납품비중 50% 이상인 기업 중 납품처 다각화 계획이 명확하지 않은 경우 또는 기 선정기업(월드클래스300기업\
    \ 포함)의 계열기업(지분관계 30% 이상) 중 계열기업 간 거래관계의 독립성이 인정되지 않는 경우에는 선정에서 제외될 수 있음\nㅇ 종합평가 대상 중 사모펀드, 외국계 기업 등이 최대주주 또는 경영상 주요주주인\
    \ 경우, 해당 기업의 장기 성장 지원 계획을 제출받고 평가에 반영 \n4\n평가 절차 및 기준\n4-1. 평가절차 \n시행계획 공고\n신청접수\n요건심사\n분야평가\n(성장전략서)\n현장확인\n(필요시)\n연구개발\n\
