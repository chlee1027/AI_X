    \ 책임자\n※ 월드클래스 셰르파 : 월드클래스기업 및 월드클래스 후보기업의 성장 촉진을 위해 금융, 인력, 컨설팅 등을 지원하는 지원기관 협의체(별표1 참고) \n3\n신청자격 등 \n3-1. 신청자격\n□ 월드클래스\
    \ 기업\nㅇ ’22년 결산 재무제표 기준 매출액 1조원 미만의 중견기업1) 또는 매출액 700억원 ~1조원의 중견기업 후보기업2)\n＊ 중견기업 매출액 기준 하한선 無 \n1) ‘중견기업’이란 「중견기업 성장촉진\
    \ 및 경쟁력 강화에 관한 특별법」제2조 1호의 기업임 \n2) ‘중견기업 후보기업’이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」제2조 2호의 기업임\nㅇ ’22년 결산 재무제표 기준 직간접 수출비중\
    \ 20% 이상이면서 최근 3년 평균 R&amp;D 투자비율 2% 이상 또는 최근 5년 연평균 매출 증가율 15% 이상 \n글로벌 지향성\n집중적 연구개발\n성장성\n전년도 재무제표 기준 직간접* 수출비중이 전체매출액의\
    \ 20%이상\nand\n최근 3년간 매출액 대비 R&amp;D 투자비율 2% 이상\nor\n최근 5년간 연평균 매출액 증가율(CAGR**) 15% 이상\n* 직간접 수출 : 직수출(한국무역협회 자료) + 기타\
