    □ 주관연구개발기관(월드클래스 후보기업) – 중견기업 또는 중견기업 후보기업\n: 조건①과 조건② 모두 충족 시 신청가능\n- 조건①과 조건②의 재무제표 기준은 동일해야 함 \n＊ 매출, 수출비중, R&amp;D투자비율,\
    \ 매출액 증가율 등의 산정을 위한 재무제표란 개별 재무제표를 말함(연결 재무제표 기준 실적 불가) \n＊＊ 주관연구개발기관은 기업으로 접수 마감일 현재 법인사업자이어야 하며, 중견기업의 경우 한국중견기업연합회의\
    \ ‘중견기업확인서’를, 중견기업 후보기업의 경우 ‘중소기업 확인서’ 및 ‘최근 5년 재무제표’를 제출 \n(조건①) ’23년 결산 재무제표 또는 ‘24년 추정 재무제표1)기준 매출액 1조원 미만의 중견기업2)\
    \ 또는 매출액 700억원~1조원의 중견기업 후보기업3) \n＊ 중견기업 매출액 기준 하한선 無 \n1) 추정 재무제표는 미확정 재무제표이므로 ’25년 3월말까지 감사보고서를 제출하여 요건에 부합하지 않는 것이\
    \ 확인될 경우 선정을 취소함 \n2) ‘중견기업’이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」제2조 1호의 기업임 \n3) ‘중견기업 후보기업’이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」제2조\
    \ 2호의 기업임\n(조건②) ’23년 결산 재무제표 또는 ‘24년 추정 재무제표1) 기준 직접 수출비중 50% 미만이며, 최근 3년 평균 R&amp;D 집약도 1% 이상 \n1) 추정 재무제표는 미확정 재무제표이므로\
    \ ’25년 3월말까지 감사보고서를 제출하여 요건에 부합하지 않는 것이 확인될 경우 선정을 취소함 \n글로벌 지향성\n집중적 연구개발\n전년도 재무제표 기준 직접 수출 비중이 전체 매출액의 50% 미만 \nand\n\
    최근 3년간 매출액 대비 R&amp;D 투자 비율 1% 이상 \n* 직접 수출 : 직수출(한국무역협회 자료) \n✪ 23년 결산 재무제표 제출 시\n글로벌 지향성 ⇨ 23년 재무제표 기준 직접 수출비중이 전체 매출액의\
    \ 50% 미만\n집중적 연구개발 ⇨ 21, 22, 23년 매출액 대비 R&amp;D 투자 비율 1% 이상\n✪ 24년 추정 재무제표 제출 시\n글로벌 지향성 ⇨ 24년 재무제표 기준 직접 수출비중이 전체 매출액의\
