    \ 접수·관리, 심사결과 안내, 시상품 발송\n3. 보유 및 이용 기간: 공모전 종료 후 3개월까지 보관 후 파기\n4. 동의 거부 시 참가신청이 제한될 수 있습니다.\n \n□동의함  □동의하지 않음\n신청인(법정대리인)\
    \ :               (인 또는 서명)\n출품작 저작권\n및 사용동의\n본인은 출품작과 관련하여 다음 사항에 동의합니다.\n \n1. 출품작은 본인이 직접 창작한 순수 창작물이며, 타인의 저작권을 침해하지\
