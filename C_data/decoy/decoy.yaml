    \ 하여 제재처분을 받은 자가 신규 연구개발과제를 신청하는 경우(3점)\nㅇ 최근 3년 이내에 정당한 사유 없이 연구개발과제 수행을 포기한 자가 신규 연구개발과제를 신청하는 경우(2점)\n5\n연구개발비 지원기준\
    \ 및 기술료 징수 기준\n5-1. 연구개발비 지원기준 \n□ 정부지원연구개발비 지원 및 기관부담연구개발비 부담 조건\n① 과제 연구개발비 구성\nㅇ과제의 연구개발비는 정부지원연구개발비와 기관부담연구개발비(현금\
    \ 및 현물)로 구성 \nㅇ연구개발과제에 참여하는 자는 정부지원연구개발비를 지원받아 과제를 수행하여야 하며, 영리기관의 경우 기관부담연구개발비 중 현금을 개별 부담하여야 함 \n② 정부지원연구개발비 지원 비율\n\
    ㅇ정부지원연구개발비 지원비율은 아래의 표와 같이 연구개발기관 유형 및 과제 유형에 따라 차등 지원 \n- 다만 ⌜중견기업 성장촉진 및 경쟁력 강화에 관한 특별법⌟ 시행령 제7조에 따라 산정한 평균 매출액 등이 3천억\
    \ 원 미만인 중견기업은 기업 유형에 관계없이 중소기업 수준으로 정부지원연구개발비를 지원할 수 있음 \n연구개발기관1) 유형\n참여 유형\n혁신제품형\n중견기업2)\n주관⋅공동\n해당 연구개발기관 연구개발비의 50%\
    \ 이하\n중견기업 후보기업3) \n주관⋅공동\n해당 연구개발기관 연구개발비의 67% 이하\n중소기업4)\n공동\n해당 연구개발기관 연구개발비의 67% 이하\n대기업5)\n공동\n해당 연구개발기관 연구개발비의 33%\
    \ 이하\n그 외\n공동\n해당 연구개발기관 연구개발비의 100% 이하\n1) ‘연구개발기관’이란 과제수행을 위하여 선정된 주관연구개발기관 및 공동연구개발기관임\n2) ‘중견기업’이란 「중견기업 성장촉진 및 경쟁력\
    \ 강화에 관한 특별법」제2조 1호의 기업임\n3) ‘중견기업 후보기업’이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」제2조 2호의 기업임\n4) ‘중소기업’이란「중소기업기본법」제2조제1항 및 3항과 같은\
    \ 법 시행령 제3조(중소기업 범위)에 따른 기업임\n5) ‘대기업’이란 「중소기업기본법」 제2조에 따른 중소기업 및 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조제1호에 따른 중견기업이 아닌 기업임\n\
    &lt;중견기업 성장촉진 및 경쟁력 강화에 관한 특별법 시행령 제 7조&gt;\n제7조(평균매출액등의 산정) ① 평균매출액등을 산정하는 경우 매출액은 일반적으로 공정ㆍ타당하다고 인정되는 회계관행에 따라 작성한 손익계산서상의\
    \ 매출액을 말한다. 다만, 업종의 특성에 따라 매출액에 준하는 영업수익 등을 사용하는 경우에는 영업수익 등을 말한다.\n② 평균매출액등은 다음 각 호의 구분에 따른 방법에 따라 산정한다.\n1. 직전 3개 사업연도의\
    \ 총 사업기간이 36개월인 경우: 직전 3개 사업연도의 총 매출액을 3으로 나눈 금액\n2. 직전 사업연도 말일 현재 총 사업기간이 12개월 이상이면서 36개월 미만인 경우(직전 사업연도에 창업하거나 합병 또는\
    \ 분할한 경우로서 창업일, 합병일 또는 분할일부터 12개월 이상이 지난 경우는 제외한다): 사업기간이 12개월인 사업연도의 총 매출액을 사업기간이 12개월인 사업연도 수로 나눈 금액\n3. 직전 사업연도 또는\
    \ 해당 사업연도에 창업하거나 합병 또는 분할한 경우로서 제2호에 해당하지 아니하는 경우: 다음 각 목의 구분에 따라 연간매출액으로 환산하여 산정한 금액\n가. 창업일, 합병일 또는 분할일부터 12개월 이상이 지난\
    \ 경우: 산정일이 속하는 달의 직전 달부터 역산(逆算)하여 12개월이 되는 달까지의 기간의 월 매출액을 합한 금액\n나. 창업일, 합병일 또는 분할일부터 12개월이 되지 아니한 경우: 창업일이나 합병일 또는 분할일이\
    \ 속하는 달의 다음달부터 산정일이 속하는 달의 직전 달까지의 기간의 월 매출액을 합하여 해당 월수로 나눈 금액에 12를 곱한 금액. 다만, 다음 중 어느 하나에 해당하는 경우에는 창업일이나 합병일 또는 분할일부터\
    \ 산정일까지의 기간의 매출액을 합한 금액을 해당 일수로 나눈 금액에 365를 곱한 금액으로 한다.\n1) 산정일이 창업일, 합병일 또는 분할일이 속하는 달에 포함되는 경우\n2) 산정일이 창업일, 합병일 또는\
    \ 분할일이 속하는 달의 다음 달에 포함되는 경우\n③ 제2항에 따라 평균매출액등을 산정하는 경우 창업일, 합병일 및 분할일에 관하여는 「중소기업기본법 시행령」 제2조제1호 및 제2호를 준용한다.\nㅇ산업위기지역\
    \ 소재기업1) 중, 중소기업이 수행하는 과제는 예외적으로 정부지원연구개발비 지원비율을 해당 연구개발기관 연구개발비의 80% 이하로 할 수 있으며, 산업위기지역 소재 기업 중 중견기업이 수행하는 과제의 경우에는\
    \ 65% 이하로 할 수 있음 \n1) ‘산업위기지역 소재 기업’이란, ｢지역 산업위기 대응 및 지역경제 회복을 위한 특별법｣제8조제2항, 제9조제2항, 제10조제6항 및 제8항, 제13조와 같은 법 시행령 제6조제3항,\
    \ 제7조제4항, 제8조제3항 및 제6항에서 위임한 사항과 그 시행에 관하여 필요한 사항을 규정하기 위해 산업통상자원부에서 고시한 “지역 산업위기대응 제도의 지정기준 등에 관한 고시”에 따라 지정된 산업위기대응특별지역의\
    \ 주된 산업에 종사하는 기업임(지정 기간에 한함) \n③연구개발기관에서 부담하여야 할 기관부담연구개발비 중 현금부담 비율은 아래의 표와 같음\n- 다만 ⌜중견기업 성장촉진 및 경쟁력 강화에 관한 특별법⌟ 시행령\
    \ 제7조에 따라 산정한 평균 매출액 등이 3천억원 미만인 중견기업은 기업 유형에 관계없이 현금부담 비율을 중소기업 수준으로 할 수 있음 \n연구개발기관 유형\n혁신제품형\n대기업\n해당 연구개발기관 기관부담연구개발비의\
    \ 15% 이상\n중견기업\n해당 연구개발기관 기관부담연구개발비의 13% 이상\n중견기업 후보기업\n해당 연구개발기관 기관부담연구개발비의 10% 이상\n중소기업\n해당 연구개발기관 기관부담연구개발비의 10% 이상\n\
    그 외\n필요시 부담\nㅇ중견·중소기업이 ‘3-3. 연구개발비 산정 시 유의사항’에서 정하는 ‘청년의무채용’ 이외에 추가로 청년인력 만 34세 이하(채용시점 기준, 군 복무 기간만큼 추가로 인정하되 월 단위로 계산(1개월\
    \ 미만은 올림)하여 최대 만 39세까지 한정)를 신규채용 할 경우, 추가채용인력의 해당 연도 인건비 액수만큼 해당 연도 기관부담연구개발비 현금을 감액할 수 있으며, 필요 시 동액 상당의 현물을 추가로 부담할 수\
    \ 있음(이미 기관부담연구개발비 현금을 납부한 경우 현금의 감액 범위는 해당 연구개발기관이 추가채용 사실을 소명하여 감액 승인을 요청한 시점의 연구개발비 현금 잔액을 한도로 함)\n- 해당 신규인력에 대해 인건비\
    \ 현금 계상 가능(대기업은 제외) \n- 해당 인력의 고용이 계속 유지되는 경우, 차년도에도 해당 인건비만큼 기관부담연구개발비의 현금 감액 가능함. 민간부담현금 감액 이후 해당 인력의 고용이 종료(퇴사 등)되는\
    \ 경우 당초 인건비로 계상한 인건비(전액 또는 부족액) 반납 및 감액한 기관부담연구개발비의 현금 추가 납부 \nㅇ중견·중소기업이 외부 기술도입을 한 경우 평가단의 심의를 거쳐 해당 참여기업의 차년도 기관부담연구개발비\
    \ 중 현금부담 비율을 중견기업은 30％, 중소기업은 20％로 경감할 수 있다. 이로 인해 정부지원연구개발비의 기관부담연구개발비 간 비율이 달라지더라도 연구개발기관이 현물을 추가로 부담하지는 아니함 \n5-2.\
    \ 기술료 징수 여부 및 방법\n□ 기술료 징수 대상 및 방법 \nㅇ 기술료 징수 대상\n- 과제 종료(조기종료 포함) 후 평가결과 우수, 보통, 미흡인 과제의 영리 주관연구개발기관 또는 영리 공동연구개발기관 \n\
    * 전문기관은 성과를 실시하는 권리와 관련하여 기술료(수익)의 일부를 징수 \nㅇ 기술료 징수 기준\n- 「국가연구개발혁신법」, 「국가연구개발혁신법 시행령*」, 「기술료 징수 및 관리에 관한 통합요령」에 규정된\
    \ 바에 따라 산정한 기술료 또는 수익의 일부를 전문기관에 납부 \n* 제38조(기술료의 납부), 제39조(연구개발성과로 인한 수익의 납부) \n- 「기술료 징수 및 관리에 관한 통합요령」에 따라 기술료 등 납부의무기관은\
    \ 아래 구분에 따라 산정한 납부액을 기술료를 처음 징수한 날(혹은 연구개발성과 매출이 처음 발생한 날)이 속한 해의 다음 해부터 5년이 되는 날 또는 연구개발과제가 종료된 날부터 7년이 되는 날 중 먼저 도래하는\
    \ 날까지 전문기관의 장에게 납부 \n기술료 등\n납부 의무기관\n제3자로부터 \n기술료를 징수한 경우\n직접 연구개발성과를 실시하여 수익이 발생한 경우\n납부 상한\n중소기업\n기술료 징수액의 2.5%\n연구개발성과\
    \ 매출액×\n기술기여도＊×2.5% \n정부지원 \n연구개발비의 10%\n중견기업\n기술료 징수액의 5%\n연구개발성과 매출액×\n기술기여도×5%\n정부지원 \n연구개발비의 20%\n공기업, \n기타 기업 \n\
    기술료 징수액의 10%\n연구개발성과 매출액×\n기술기여도×10%\n정부지원 \n연구개발비의 40%\n* 기술기여도 : 연구개발활동에 소요되는 전체 비용 중 정부지원연구개발비가 차지하는 비중으로, 중앙행정기관의\
