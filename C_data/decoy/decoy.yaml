  html: <div class="subCntBody clearfix"><div><div id="cntntsView"><p class="bu_st1">미화 1만불 이내의 지급수단등을 수입하는 경우에는 허가 및 신고가 필요없습니다. 또한 약속어음, 신용장, 환어음을 수입하는 경우에도 신고나 허가가 필요없습니다. 그러나 모두 합하여 미화로 1만 불에 상당하는 금액을
    초과하는 외화, 원화, 수표 등의 지급수단을 휴대하여 입국하는 경우에는 세관에 신고하여야 합니다. 원화표시 자기앞 수표도 마찬가지 입니다.</p></div></div></div>
