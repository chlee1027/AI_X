    전용지원\n인력\n⑳ 히든챔피언 전용관 및 채용 지원\n잡코리아(유)\n비용할인\n㉑ HR 솔루션 제공 \n인크루트(주) \n비용할인 \n2\n사업추진체계\n사업총괄\n산업통상자원부\n전문기관\n한국산업기술진흥원\n\
    지원기관\n월드클래스 셰르파*\n수행기관(연구개발기관)\n월드클래스기업\n월드클래스 후보기업 \n···\n주관기관\n주관연구\n개발기관\n공동연구\n개발기관1\n공동연구\n개발기관2\n공동연구\n개발기관N\n월드클래스기업\n\
