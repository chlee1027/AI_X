    \ 기관 \nㅇ 국외 소재 기관(기업, 대학 및 연구소 등)의 경우 공동연구개발기관으로 사업 참여 가능함 \n3-3. 지원제외 처리기준\n□ 아래의 경우에는 지원대상에서 제외함\nㅇ 기존 월드클래스기업(월드클래스300\
    \ 기업 포함)은 월드클래스 후보기업으로 신청불가 \n- 다만 월드클래스300 기업 중 R&amp;D 미지원 기업이 월드클래스 후보기업 자격 요건에 부합하는 경우 신청 가능 \n※ 선정취소나 효력정지 기업은 제외함\
