- id: DC-201
  category: DECOY
  subtype: homoglyph_like_normal
  html: "<p>\n\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n\n산업통상자원부 공고 제2025-048호\
    \ \n2025년도 월드클래스플러스사업 신규지원 공고 \n- 월드클래스 후보기업 (R&amp;D 지원) - \n세계적 수준의 중견기업 육성을 위하여 산업통상자원부에서 추진하고 있는 ｢월드클래스플러스사업｣ - 월드클래스\
    \ 후보기업 연구개발 지원사업(R&amp;D) 의 2025년도 신규지원을 다음과 같이 공고하오니 수행하고자 하는 자는 신청하여 주시기 바랍니다. \n2025년 1월 20일\n산업통상자원부장관\n&lt; 목 차 &gt;\n\
    1. 사업개요\n1-1. 사업 목적\n1-2. 사업 개요\n1-3. 지원대상분야\n1-4. 지원내용\n2. 사업추진체계\n3. 지원분야 및 신청자격 등\n3-1. 지원분야\n3-2. 신청자격\n3-3. 지원제외\
    \ 처리기준\n4. 평가 절차 및 기준\n4-1. 평가절차 \n4-2. 평가기준\n5. 연구개발비 지원기준 및 기술료 징수기준\n5-1. 연구개발비 지원기준 \n5-2. 기술료 징수 여부 및 방법\n5-3. 연구개발비\
    \ 산정 시 유의사항\n6. 근거법령 및 규정\n7. 신청방법 \n8. 제출서류\n9. 지정기간 및 지원내용\n10. 기타 유의 사항\n11. 사업설명회 및 문의처 등 \n1\n사업개요\n1-1. 사업 목적\n\
    ㅇ 성장의지와 기술잠재력을 갖춘 중견기업 및 중견기업 후보기업을 집중 지원하여, 중견기업의 성장 촉진 및 글로벌 경쟁력 강화\nㅇ 특정기업 의존을 벗어나 독자적 신시장 진출을 희망하는 중견기업 및 중견기업 후보기업의\
    \ 미래 전략 기술 개발 지원 \n1-2. 사업 개요 \n구분\n월드클래스 후보기업* 연구개발 지원사업 \n지원 규모\n- 10개 내외 \n지원\n내용\nR&amp;D\n- 기업별 3~4년간 국비 30억원 내외\
    \ 지원(최대 50억원)\n* 연간 7.5억원~12.5억원 (연평균 7.5억 원 내외) \n* 과제당 예산은 연구개발계획서 평가 후 조정될 수 있음 \n지원 기간 : 최대 4년 \n비R&amp;D\n(지원시책)\n\
    24개 지원시책 지원\n* 법률, 금융, 인력, 수출, 컨설팅 등 기업 맞춤형 해외시장 진출 지원 \n지원 기간 : 최대 5년(변동 가능)\n신청대상\n주관연구개발기관 : 중견기업 또는 중견기업 후보기업 \n*\
    \ 지원대상 신청자격 및 지원제외 처리기준은 ‘3-2. 신청자격’, ‘3-3. 지원제외 처리기준’ 참조 \n신청조건\n- 조건 1과 2 모두 충족 \n* 충족 여부는 [붙임2] 월드클래스플러스 신청요건 확인을 활용하여\
    \ 확인 가능 \n** 기업사정에 따라 2023년까지의 실적 또는 2024년 가결산 자료기준 작성 선택가능 \n조건 1 \n’23년 결산 재무제표 또는 ‘24년 추정 재무제표 기준 \n매출액 1조원 미만의 중견기업(매출액\
    \ 하한선 無) 또는 \n매출액 700억원~1조원의 중견기업 후보기업(지원가능 기준 별도 有) \n조건 2 \n① \n’23년 결산 재무제표 또는 ‘24년 추정 재무제표 기준 \n직접 수출 비중 50% 미만이며,\
    \ \n② \n최근 3년 평균 R&amp;D 집약도 1% 이상 \n제출 서류 \n① 성장전략서 \n② 연구개발계획서 \n③ 신청양식 등 \n* 월드클래스 후보기업이란 월드클래스 기업이 아닌 내수 중심 중견기업 및\
