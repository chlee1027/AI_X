    \ 주의조치에 해당하는 문제발생 시 정책심의회 심의를 통해 선정취소 또는 주의조치 될 수 있음 \nㅇ 과제별로 신청가능한 정부지원연구개발비의 최대범위는 명기된 지원 금액을 초과할 수 없음\nㅇ 선정된 과제의 연구개발비(연구비)\
    \ 및 개발기간은 평가결과에 따라 조정될 수 있으며, 과제 추진 중 관련 규정에 따라 관련 평가 등을 통해 과제가 중단될 수 있음\nㅇ 월드클래스플러스프로젝트지원, 중견기업-공공연기술혁신챌린지, 중견기업-지역혁신얼라이언스지원,\
    \ 중견기업재도약지원, 중견중소기업상생형혁신도약사업을 수행 중인 영리 기업(주관)은 지원할 수 없으며, 유사 과제로 동시에 신청하여 선정되는 경우 1개 과제를 제외하고 모두 선정 취소됨\n□ 지식재산권 및 발생품의\
    \ 귀속\nㅇ 사업의 수행과정에서 발생하는 장비, 연구시설 및 시작품 등 유형적 성과물은 주관연구개발기관의 소유로 함. 다만, 연구개발계획서에 따라 공동연구개발기관이 소유를 목적으로 취득한 유형적 성과물은 해당\
    \ 연구개발기관의 소유로 함\nㅇ 사업의 수행과정에서 발생하는 지식재산권, 보고서의 저작권, 연구노트 등 무형적 성과물은 개별 성과물을 연구개발한 기관의 단독 소유로 함. 다만, 복수의 연구개발기관이 공동으로 성과물을\
    \ 개발한 경우 그 성과물은 공동으로 개발한 연구개발기관의 공동 소유로 하며, 단독 또는 공동소유의 판단은 연구개발계획서 내용(추진방법, 편성도, 연구개발기관별 연구담당분야, 연구개발비 구성 등)을 근거로 성과물의\
    \ 개발에 기여했는지 여부를 기준으로 함\nㅇ 외국기관이 참여한 과제의 경우, 해당 기관이 사업의 수행결과로 발생하는 지식재산권을 소유할 때에는 국내 연구개발기관에게 무상의 통상실시권을 부여하여야 함\n□ 중소기업에\
    \ 대한 IP 실시권 확산\nㅇ 연구개발기관은 해당 과제를 통해 각자 개발한 성과물의 실시를 위하여 필요한 범위 내에서 동 과제의 다른 연구개발기관이 보유한 성과물을 실시할 수 있음. 이때, 성과물의 실시기간 및\
    \ 조건에 대해서는 서로 합의하여 정함\nㅇ 비영리기관은 참여기업 아닌 중소기업이 무형적 성과물에 대해 실시 허락을 요청한 경우 이에 응하여야 함\n- 다만, 중소기업인 실시기업에 대한 기술료율은 「기술료 징수\
    \ 및 관리에 관한 통합요령」에 따른 기술료율 이내에서 서로 합의하여 정함\nㅇ 기타 산업기술혁신사업 공통 운영요령 제37조 및 37조의2 참조\n□ 보안등급 분류\nㅇ 신청자는 신청 과제의 보안등급(보안/일반)을\
    \ 분류하여 이를 연구개발계획서에 표기하여야 함\nㅇ 보안 과제는 아래의 어느 하나에 해당하는 과제임\n- 세계 초일류 기술제품의 개발과 관련되는 연구개발과제\n- 외국에서 기술이전을 거부하여 국산화를 추진 중인\
    \ 기술 또는 미래 핵심기술로서 보호의 필요성이 인정되는 연구개발과제\n- 「산업기술의 유출방지 및 보호에 관한 법률」제2조제2호의 국가핵심기술과 관련된 연구개발과제\n- 「대외무역법」제19조 1항 및 동법 시행령\
    \ 제32조의2의 수출허가 등의 제한이 필요한 기술과 관련된 연구개발과제\n- 「방위사업법」 제3조제1호에 따른 방위력개선사업과 관련된 연구개발과제\nㅇ선정된 연구개발과제 중 외국에 소재한 기관·단체 또는 외국인과\
    \ 공동으로 연구를 수행하는 경우에는 해당 연구개발과제가「대외무역법」 제20조제2항에 따라 전략물자에 해당하는지에 관한 판정을 신청하여 그 결과에 따라 그 연구개발과제를 보안과제로 분류할 수 있음 \n□ R&amp;D자율성\
    \ 트랙 \nㅇ 개요 \n- R&amp;D자율성트랙은 연구개발기관이 선정된 이후 주관연구개발기관이 선택적으로 신청할 수 있고, 해당 과제가 R&amp;D자율성트랙으로 선정되면 R&amp;D 수행절차를 완화해 주는\
