  html: "<p>\n\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n\n산업통상자원부 공고 제2023-347호\
    \ \n2023년도 월드클래스플러스사업 신규지원 공고 \n- 월드클래스 기업(비R&amp;D 지원) - \n세계적 수준의 중견기업 육성을 위하여 산업통상자원부에서 추진하고 있는 ｢월드클래스플러스사업｣ - 월드클래스\
    \ 기업(비R&amp;D 지원)의 2023년도 신규지원을 다음과 같이 공고하오니 수행하고자 하는 자는 신청하여 주시기 바랍니다. \n2023년 4월 12일\n산업통상자원부장관\n&lt; 목 차 &gt;\n1. 사업개요\n\
    1-1. 사업 목적\n1-2. 사업 구성\n1-3. 지원대상분야\n1-4. 지원내용\n2. 사업추진체계\n3. 신청자격 등\n3-1. 신청자격\n3-2. 지원제외 처리기준\n4. 평가 절차 및 기준\n4-1. 평가절차\
    \ \n4-2. 평가기준\n5. 근거법령 및 규정\n6. 신청방법 \n7. 제출서류\n8. 지정기간 및 지원내용\n9. 기타 유의 사항\n10. 문의처\n&lt; 월드클래스플러스프로젝트 일러두기 &gt; \nTRACK\
    \ 1. 월드클래스 기업 \n1. 정의 : 성장의지와 혁신역량을 갖춘 세계적 전문기업 \n2. 지원 대상 : 매출 1조원 미만 중견기업 또는 매출 700억원이상 1조원 미만 중견기업 후보기업 \n- 상세 지원 조건은\
    \ ‘3-1. 신청자격’ 참고 혹은 ‘[붙임2]’를 활용하여 확인 가능 \n3. 지원 내용 : 선정된 월드클래스 기업이 한국형 히든챔피언 기업으로 도약하기 위해 기업이 필요로 하는 지원시책을 5년간 패키지로 지원\
    \ \n① R&amp;D : 미지원 \n② 비R&amp;D : 금융(우대금리, 요건면제, 우대지원 등)·수출(KOTRA 중견기업 글로벌 지원사업 등)·인력(채용지원 등)·컨설팅(지재권 컨설팅, ESG 컨설팅 등)\
    \ 등 지원 \n4. 지정 기간 : 선정 연도로부터 총 5년 \n- 추가 5년 연장 가능 : 5년차 점검을 통해 핵심 목표를 충실히 이행하고 있거나, 목표 재설정, 성장전략 수정 등을 통한 지속 지원 필요성이 인정될\
    \ 경우\n※ 이번 공고를 통해 선정하고자 하는 기업은 ‘월드클래스 기업’에 한함\nTRACK 2. 월드클래스 후보기업 \n1. 정의 : 특정기업 의존을 벗어나 독자적 신시장 진출을 희망하는 기업 \n2. 지원\
    \ 대상 : 매출 1조원 미만 중견기업 또는 매출 700억원이상 1조원 미만 중견기업 후보기업 \n3. 지원 내용 : 기업의 혁신 역량 확충(R&amp;D)부터 금융·수출·인력 등(비R&amp;D)까지 기업 성장을\
    \ 위한 패키지 지원 \n① R&amp;D : 과제당 국비 평균 30억 원(최대 40억 원) / 최대 4년 \n② 비R&amp;D : 금융(우대금리, 요건면제, 우대지원 등)·수출(KOTRA 중견기업 글로벌 지원사업\
    \ 등)·인력(채용지원 등)·컨설팅(지재권 컨설팅, ESG 컨설팅 등) 등 지원 \n4. 지정 기간 : 선정 연도로부터 총 5년 \n- 추가 5년 연장 가능 : 5년차 점검을 통해 핵심 목표를 충실히 이행하고 있거나,\
    \ 목표 재설정, 성장전략 수정 등을 통한 지속 지원 필요성이 인정될 경우 \n- R&amp;D : 최대 4년 지원 \n5. 월드클래스 기업 승격 : R&amp;D 과제 종료 후 5년 이내에 월드클래스기업으로 승격신청\
    \ 가능 \n- 승격신청 시 정책심의회에서 심의를 거쳐 월드클래스 기업으로 선정 가능 \n- 월드클래스 기업 승격 후 추가 5년 연장 불가 \n※ `23년 월드클래스 후보기업(R&amp;D 지원) 모집공고는 산업통상자원부\
    \ 공고 제2023-062호(2023.01.19. 시행)를 참고바라며, 향후 차년도 사업공고(`23년 말 또는 `24년 초)를 통해 월드클래스 후보기업 15개사(잠정) 신규 선정 예정\n1\n사업개요\n1-1.\
    \ 사업 목적\nㅇ 성장의지와 기술잠재력을 갖춘 중견기업 및 중견기업 후보기업을 집중 지원하여, 중견기업의 성장 촉진 및 글로벌 경쟁력 강화 \n1-2. 사업 개요 \n구분\n월드클래스기업 \n지원규모\n- 5개\
    \ 내외\n지원\n내용\n비R&amp;D\n(지원시책)\n- 인력, 수출, 컨설팅 등 기업 성장에 필요한 경영 지원 \n* 금융, 인력, 수출 컨설팅 등 기업맞춤형 해외시장 진출 지원\n* [별표1] 월드클래스\
    \ 셰르파 지원시책 참고 \n- 월드클래스 기업 글로벌 성장 금융 지원(정책금융, 6,000억원 규모) \n지원대상\n중견기업 또는 중견기업 후보기업 \n* 지원대상 신청자격 및 지원제외 처리기준은 ‘3-1. 신청자격’,\
    \ ‘3-2. 지원제외 처리기준’ 참조 \n지원조건\n- 조건 1, 2, 3 모두 충족 \n* 충족 여부는 [붙임2] 월드클래스플러스 신청요건 확인을 활용하여 확인 가능 \n조건 1 \n‘22년 결산 재무제표 기준\
    \ \n매출액 1조원 미만의 중견기업 또는 \n매출액 700억원~1조원의 중견기업 후보기업\n조건 2 \n‘22년 결산 재무제표 기준 \n직간접 수출비중 20% 이상이면서, \n조건 3\n최근 3년 평균 R&amp;D\
    \ 투자비율 2% 이상 \n또는 \n최근 5년 연평균 매출증가율 15% 이상 \n참고사항\n① 성장전략서 \n② 신청양식 \n※ 월드클래스 후보기업(R&amp;D 지원) 모집공고는 산업통상자원부 공고 제2023-062호(2023.01.19.\
    \ 시행)를 참고바라며, 월드클래스 기업은 월드클래스 후보기업 중복 지원 불가함 \n1-3. 지원대상 분야\nㅇ 중점지원분야(16대 전략산업, 28개 품목)\n전략산업\n유망품목\n전략산업\n유망품목\n자동차\n\
    모터, 인버터\nIoT 가전\nIoT가전, 첨단센서\n자율주행 핵심부품\n스마트홈 서비스\n반도체 디스플레이\n파워·시스템반도체\nICT 융합신산업\nAI제품·서비스\n차세대OLED장비·부품·소재\n클라우드 서비스\n\
    석유화학\n정밀화학기초원료\n유통\nAI기반 상품추천 등\n전자소재\n가상현실(VR)쇼핑몰\n섬유\n아라미드 등 산업용 섬유\n항공드론\n드론부품\n고기능·고강성 원단소재\n개인용 비행체(PAV)\n철강\n고부가\
    \ 경량 금속\n로봇\n협동로봇\n조선\n친환경 기자재\n서비스로봇\n건설\n건물건설건축\n에너지\n신산업\n풍력부품\n바이오 헬스\n바이오 의약\n스마트미터, ESS\n혁신의료기기\n과학기술\n서비스\n엔지니어링\
    \ 및 과학기술서비스\n개인맞춤 헬스케어\n정보통신\nSW개발 및 정보서비스\n* 전·후방 연관 산업 및 품목도 가능 \n* 품목 일치 여부는 성장전략서를 기준으로 판단하며, 분야평가(기술확보 분야)에서 평가 \n\
    1-4. 지원 내용 \nㅇ 금융, 인력, 수출 컨설팅 등 기업 맞춤형 해외시장 진출 지원 \n지원시책\n지원기관\n주요 지원형태\n기업\n지원\n① 중견기업 신사업 진출 지원\n한국중견기업연합회\n우대지원\n수출\n\
    ② 중견기업 글로벌 지원사업\n대한무역투자진흥공사\n전용지원\n③ TBT 애로해소 및 대응역량 강화 지원\n한국시험인증산업협회\n우대지원\n④ FTA관련 기업 맞춤형 교육·컨설팅 지원\n한국무역협회\n우대지원\n\
    ⑤ 월드클래스+ 종합지원 프로그램\n한국무역보험공사\n우대지원\n고용\n⑥ 리딩코리아 월드클래스 잡 페스티벌\n한국산업기술진흥원\n전용지원\n금융\n⑦ 히든챔피언 육성 프로그램\n한국수출입은행\n우대금리\n⑧ KDB\
    \ Global CHallengers 200\nKDB산업은행\n요건면제\n⑨ 월드클래스+ 기업 종합지원 프로그램\nNH농협은행\n우대금리\n⑩ 월드클래스 프로젝트 지원\n하나은행\n우대금리\n⑪ 월드클래스+ 글로벌\
    \ 챔프 육성사업\nSGI 서울보증\n우대지원\n⑫ 월드클래스+ 종합지원 프로그램\n우리은행\n우대지원\n컨설팅\n⑬ 국제 지재권 분쟁 대응전략 컨설팅 지원\n한국지식재산보호원\n우대가점\n⑭ 월드클래스플러스 IP\
    \ 서포터즈 프로그램\n한국발명진흥회\n전용지원\n⑮ 글로벌 경쟁력 강화를 위한 IP 전략 수립 지원\n한국특허전략개발원\n우선지원\n⑯ 해외 M&amp;A·기술도입 종합지원\n한국소재부품장비투자기관협의회\n전용지원\n\
