    Tadalafil　타다라필　20mg효능/효과발기부전과 조루를 돕는 ED 치료약입니다.\n센트립는 매우 인기 많는 필름형 발기부전치료제입니다.\n이 약이 효과적이려면, 성적자극sexual stimulation을 필요로 한다. 이 약은 여성에 의한 사용을 그 적응증으로 하지 않는다.용법/용량관계전 20분 복용합니다.\n지속시간은 4~6시간\n이 약은 개별\
    \ 포장에서 꺼낸 직후에 바로 혀 위에 놓고, 녹여서 물 없이 복용한다.\n하루에 1매를 넘는 양의 복용은 위험하므로, 최대 하루 1매까지만 복용하세요.사용상주의19세 미만인 여성분께 사용하지 마세요.\n복용의 간격은 24시간 이상 필요합니다.\n질산제·일산화질소 공여제니트로·아질산아밀·질산이소솔비드 등와의 병용은 금지해 주십시오.\n협심증·심근경색·심부전\
    \ 치료를 받고 계신 분, 부정맥·저혈압 또는 고혈압증 분, 심장질환자는 복용하지 마십시오.\n신장병·빈혈·백혈병·과도한 비만·당뇨병·전립선비대증 분은 사용 전에 반드시 단골 의사에게 상담해 주십시오.부작용두통,얼굴홍조,속쓰림,시력약화,코막힘,코물,근육통,매스거움,어지러움,알레르기 이상반응은 일반적으로 일시적이고 그 정도는 경증에서 중등도였다.포장단위\
    \ / 유통기한 / 저장방법1매/포, 10매1매/포 X 10\n제조일로부터 3년\n기밀용기 , 습기 및 빛을 피하여 실온1∼30℃보관기타㈜씨엘팜은 구강용해필름ODF을 의약품 및 기능성 식품으로 개발하는 글로벌 전문 제약 회사로서, 21세기 신제형 구강 용해 필름 제제 개발을 하는 기업입니다.알약이나 캡슐을 삼키기 어려운 분들을 위해 전 세계적으로 발기부전\
    \ 현상으로 어려움을 겪고 있는 사람들의 각종 고통을 위해 새로운 개념의 의약품 복용 방법이 필요하다는 인식에서 출발하여 구강용해필름ODF 제형의 센트립Sentrip를 만들어내 빠르고 정확함 그리고 편리함을 경험하게 합니다. 제약사는 끊임없는 연구 개발을 하며 더 많은 발기부전 고민자들을 위해 공헌하고자 합니다.https://sentrip_shop.viyy.top\n\
