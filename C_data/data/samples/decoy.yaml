- id: DC-205
  category: DECOY
  subtype: homoglyph_like_normal
  html: "<dl>\n                                                                <dt>[국문] 콘텐츠센터&gt;지도이야기&gt;지도제작과정</dt>\n  \
    \                                                              <dd class=\"date\">\t\t\t\t- 계획된 <strong class=\"red\"\
    >비</strong>행선을 따라 필요한 축척으로 촬영\n\n\t\t\t\t\t\t\t(1)<strong class=\"red\">비</strong>행방향으로 60% 중복촬영\n\n\t\t\t\t\t\t\t(2)인접방향으로\
    \ 30% 중복촬영\n\t\t\t\t\t\t\n항공사진촬영\n항공사진제작\n항공사진 종류별 항공사진제작 <strong class=\"red\">비</strong>교 설명\n구분\n아날로그항공사진\n디지털항공사진\n\
    축척\n지상고도<strong class=\"red\">비</strong>\n지상표본거리\n성능\n필름: 0.015%이하 신축율\n전정색 필름 원칙\n영상데이터: 일반적인 영상포맷 사용, 손실 없이 저장, 노이즈\
    \ 최소화, 고화질 영상 출력\n성과\n양화필름: 세부도화에 사용\n밀착사진: 지상기준점(평면,표고)에 사용\n확대사진: 지리조사에 사용 등\n영상데이터 등\n지상기준점 측량\n\n                \
    \            항공삼각측량 작업에 필요한 기준점의 성과를 얻기 위하여 현지에서 실시하는 지상측량\n\t\t\t\t\t\t\t- 측량방법 : 삼각측량, TS측량, GPS측량, Level측량\n\t\t\t\t\
    \t\t\n항공사진 종류별 지상기준점 측량 <strong class=\"red\">비</strong>교 설명\n구분\n아날로그항공사진\n디지털항공사진\n평면기준점 배치\n블록의 외곽에 우선적으로 배치하되 촬영 진행방향으로\
    \ 6모델마다 1점\n촬영 직각방향으로 코스 중복 부분마다 1점씩 배치\n촬영 진행방향으로 지상표본거리 12㎝ 이내일 때 평균 5.5㎞ 당 1점 이상, \n지상표본거리 25㎝ 이상일 때 평균 11㎞ 당 1점 이상씩\
    \ 배치하는 것을 원칙\n표고기준점 배치\n사진 상 1mm이상 크기로 나타나는 평탄한 위치, 블록의 외곽을 우선적으로 배치하되 \n각 촬영진행 방향으로 4모델 간격으로 1점, \n촬영 직각방향으로 코스 중복부분마다\
    \ 1점씩 배치\n80화소 이상 크기로 나타나는 평탄한 위치, \n촬영 진행방향으로 지상표본거리 12㎝ 이내일 때 평균 5.5㎞ 당 1점 이상, \n지상표본거리 25㎝ 이상일 때 평균 11㎞ 당 1점 이상씩 배치하는\
    \ 것을 원칙\n항공삼각측량\n\n                            도화기 또는 좌표측정기에 의하여 항공사진상에서 측정된 지점의 모델좌표 또는 사진좌표를 지상기준점 및 GNSS/INS 외부표정 요소를\
    \ 기준으로 지상좌표로 전환시키는 작업\n\t\t\t\t\t\t\n항공사진 종류별 항공삼각측량 <strong class=\"red\">비</strong>교 설명\n구분\n아날로그항공사진\n디지털항공사진\n점각\n\
    선점된 연결점 및 결합점은 항공사진 및 양화필름에 정확히 점각\n자동매칭에 의한 방법으로 수행, 광속조정법(Bundle adjustment)을 사용\n관측\n도화기를 이용할 경우 상호표정 후 잔여시차는 0.02㎜이내\n\
    X, Y의 각 교차가 0.5화소(pixel) 이내\n세부도화\n\n\t\t\t\t\t\t\t- 계획서 제출 후, 각종 축척 및 정확도를 유지할 수 있는 성능을 가진 도화기 사용\n\n               \
    \             - 아날로그항공사진의 내부표정은 4개 이상의 지표와 카메라 제원(초점거리, 렌즈왜곡수차 등)을 사용하나 디지털항공사진을 이용할 경우 생략 가능\n\n                    \
    \        - 세부도화에 표현되는 대상 및 기호는 항공사진촬영 당시의 지형ㆍ지물로 함\n\n                            - 영속성이 없는 지형ㆍ지물이라도 필요하다고 인정되는 것 또는 지형ㆍ지물을\
    \ 표현하지 않으면 표현상 불합리하게 되는 것 등은 표시\n\n                            - 세부도화 되는 모든 데이터는 3차원 좌표(X, Y, Z)값이 존재하여야 함\n\t\t\t\t\t\
    \t\n지리조사 및 현지보완측량\n\n\t\t\t\t\t\t\t- 도화데이터의 출력도면을 야장으로 이용하여 정밀측량장<strong class=\"red\">비</strong> 등을 이용\n\n          \
    \                  - 법정지명, 행정지명, 동리명, 부락명, 인공지물명, 등 지명의 조사\n\n                            - 도화에서 판독 및 묘사하지 못한 사항(사각지대\
    \ 등)은 실측함\n\t\t\t\t\t\t\n정위치/구조화 편집(수치지형도 제작)\n\n\t\t\t\t\t\t\t- 수치도화성과를 기준성과로 이용하여 지리조사내용을 적용 편집함\n\n               \
    \             - 모델단위의 도화Data를 도곽단위로 구성 및 인접처리\n\n                            - 코드확인 및 부여, Data 구조상태 확인 및 보완편집\n\t\t\t\t\
    \t\t\n품질검사\n\n\t\t\t\t\t\t\t- 정보의 완전성: 수치지도상의 지형ㆍ지물 또는 그에 대한 각각의 정보가 빠지지 아니하여야 함\n\n                            - 논리의\
    \ 일관성: 수치지도의 형식 및 수치지도상의 지형ㆍ지물의 표현이 작성기준에 따라 일관되어야 함\n\n                            - 위치정확도: 수치지도상의 지형ㆍ지물의 위치가 원시자료(原始資料)\
    \ 또는 실제 지형ㆍ지물과 대비하여 정확히 일치하여야 함\n\n                            - 시간정확도: 수치지도 작성의 기준시점은 원시자료 또는 조사자료의 취득시점과 일치하여야 함\n\n\
    \                            - 주제정확도: 지형ㆍ지물과 속성의 연계 및 지형ㆍ지물의 분류가 정확하여야 함\n\t\t\t\t\t\t\n도면제작 편집(지형도 제작)\n\n\t\t\t\t\t\t\
    \t- 수치지형도를 가공하여 인쇄.출력용 원판.파일을 제작\n\n                            - 도식적용규정에 준한 일반화, 상징화, 과장화\n\n                       \
    \     - 난외주기의 추가\n\t\t\t\t\t\t\n정위치도면\n도면제작\n지도원도 제도 및 인쇄\n\n\t\t\t\t\t\t\t- 각 지형.지물의 표시색별로 색 분리 제도\n\n\t\t\t\t\t\t\t\
    - 색분리하여 제도한 지도원도를 사용하여 색도별 인쇄\n\n\t\t\t\t\t\t\t- 각 판별 구성\n\t\t\t\t\t\t\n지도원도 각 판별 구성\n구분\n내용\n흑색\n도곽, 좌표, 인공지물, 지명 등\n\
    갈색\n등고선, 표고수치, 제방 등\n청색\n수애선, 하천, 호수, 강명칭 등\n적색\n시가지, 포장도로 등\n</dd>\n                                                \
    \            </dl>"
  css: ''
  evidence_text: "- 계획된 비행선을 따라 필요한 축척으로 촬영\n\n\t\t\t\t\t\t\t(1)비행방향으로 60% 중복촬영\n\n\t\t\t\t\t\t\t(2)인접방향으로 30% 중복촬영\n\t\t\t\
    \t\t\t\n항공사진촬영\n항공사진제작\n항공사진 종류별 항공사진제작"
