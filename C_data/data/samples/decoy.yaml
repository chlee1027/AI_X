  html: "<dl>\n                                                                    <dt>「제20회 전국 어린이 지도 그리기 대회」 공모 안내</dt>\n\
    \                                                                    <dd>;15일 <strong class=\"red\">∼</strong> 10월 17일\
    \ 오후 6시까지 \n \nㅇ 작품주제 : “일상생활의 지도”(Map in Everyday Life)\n \n- 우리의 일상생활을 담은 세계지도를 창의적으로 자유롭게 표현해주세요!\n \nㅇ 응모 방법\n \n\
    - 방 법 :  개별 제출 또는 각 학교별 취합(1인 1작품 한정)\n- 직접제출, 우편, 택배 등 기간 내에 도착분에 한함 \n* 우편, 택배 발송 시 '25. 10. 17(금) 소인분까지 유효합니다. \n- 크\
    \ 기 : A3 (42㎝ × 30㎝, ※ 규격 엄수)\n \n- 제출처 : 국토교통부 국토지리정보원 국립지도박물관\n※ 제출주소 :  경기도 수원시 영통구 월드컵로 92, 국토지리정보원 (16517) \n   \
    \ 문의사항 031-210-2646, 2640, 2667\n    \n- 작품 뒷면에 참가신청서를 부착해 제출\n「제20회 전국 어린이 지도 그리기 대회」참가신청서\n작 품 명\n \n학교 및 학년반\n     \
    \      초등학교       학년       반 \n성 명\n \n전 화 번호\n학교:\n집:\n 상장 및 상금을 받을 때 사용되니 정확히 입력 바랍니다\n \n주 소\n \n □ 학교:\n \n □ 집:\n\
        □안에 상장 및 상금을 받을 주소를 체크 바랍니다\n작 품 설명\n \n \n \n      \n \n \n※ 개인정보 제공 및 활용에 동의□ <strong class=\"red\">비</strong>동의□\n\
    ■ 입상자 발표\n \nㅇ `25. 10월 말 : 국토지리정보원 홈페이지에 게시하고, 개별 통지(예정)\n \n■ 시상내역\n구 분\n인원\n시 상 명\n부 상\n<strong class=\"red\">비</strong>\
    \ 고\n대 상\n1명\n국토교통부장관상\n문화상품권\n30만원 상당\n \n우수학교상\n1개교\n국토교통부장관상\n국토지리정보원\n제작상품\n응모작품이 많은 학교\n최우수상\n3명\n국토지리정보원장상\n문화상품권\n\
    20만원상당\n1∼2학년, 1명\n3∼4학년, 1명\n5∼6학년, 1명\n우 수 상\n6명\n국토지리정보원장상\n문화상품권\n10만원상당\n1∼2학년, 2명\n3∼4학년, 2명\n5∼6학년, 2명\n장 려 상\n\
    12명\n국토지리정보원장상\n문화상품권\n5만원상당\n1∼2학년, 4명\n3∼4학년, 4명\n5∼6학년, 4명\n특 별 상\n5명\n(사)한국지도학회장상\n특별상품\n학회에서 준<strong class=\"red\"\
    >비</strong> \n※ 대상 (1명),   최우수상 (3명 중 대상 수상 학년대 수상자 1명은 제외)  입상작품은 2027년 ‘바버라 페추닉 어린이 세계지도 그리기 대회’에 출품 기회 제공(예정)\n \n\
    ■ 기타사항\n \nㅇ 제출된 작품은 반환하지 않으며 입상작을 <strong class=\"red\">비</strong>롯하여, 제출한 작품에 대한 소유 및 이용권은 국토지리정보원에 귀속됩니다.\n \nㅇ 작품\
    \ 응모에 소요되는 모든 <strong class=\"red\">비</strong>용은 응모자 부담이며, 정해진 입상 외에는 상품 및 기념품 등은 지급하지 않습니다.\n \nㅇ 제출한 출품작은 접수 이후 수정이\
    \ 불가합니다.\n \nㅇ 작품은 평평하고 두께가 5mm를 넘지 않아야 하며, 그림이 아닌 기타 입체 재료 등을 붙인 작품은 접수하지 않습니다.\n \nㅇ 작품이 규격(A3)을 초과하는 경우, 심사하지 않습니다.\n\
     \nㅇ 심사내용은 공개하지 않으며 심사 결과에 대해 이의를 제기할 수 없습니다.\n \nㅇ 응모작은 온오프라인을 통해 불특정 다수에게 공개될 수 있습니다.\n \nㅇ 시상을 위하여 신분증, 통장사본 등 개인정보를\
    \ 요구할 수 있으며, 이에 미동의 시 시상금 지급이 제한될 수 있습니다.\n \nㅇ 기타 자세한 사항 및 문의사항은 우리원 (031-210-2646, 2640, 2667)으로 문의하여 주시기 바랍니다.\n \n\
    </dd>\n\n                                                                    <dd class=\"date\"><span>[박물관] &gt;게시판&gt;공지사항｜</span>\n\
    \                                                                        <span>\n\t\t\t\t\t\t\t\t\t2025-09-09</span>\n\
    \                                                                    </dd>\n                                         \
    \                       </dl>"
