# B1+ 1단계: TF-IDF + 로지스틱 회귀, 어휘는 학습 몫만
model_id: b1plus_tfidf
analyzer: char_wb
ngram: [1, 3]
min_df: 2
max_features: 80000
C_grid: [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0]   # 검증셋 PR-AUC 로 고른다. 11-11 처음 격자의 위 끝(10)에서 골라져 30·100 을 한 번만 더함
oof_folds: 5                          # M2 용 학습 몫 OOF 점수(group_id 단위)
