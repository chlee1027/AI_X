# M3 + 규칙 D(11-19): configs/m3.yaml 과 모델·질문문·구간이 같다. 바뀐 것은 model_id·seed_cache_from 둘뿐이라 cache_key 가 같아 M3 답을 다시 쓴다
model_id: m3_route
base_model_id: m2               # 바탕 점수. 11.13 규칙 적용: M2 검증 PR-AUC 0.9396 >= TF-IDF 0.907 (다영 11.13 전달)
prompt: prompts/m3_v1.txt
claude_model: claude-opus-5-5
effort: low                     # 분류라 낮게. Opus 5.5 는 thinking 을 끌 수 없고 effort 로만 조절한다
max_tokens: 4096                # thinking 토큰도 여기에 들어간다
fallback: true                  # 거절(refusal)이면 서버가 다른 모델로 다시 돌린다. 돌린 모델은 캐시에 남긴다
use_ocr_text: true              # OCR 글을 참고로 같이 준다(최대 ocr_max_chars 자)
ocr_max_chars: 800
max_side: 1568                  # 긴 변이 이보다 크면 줄여 보낸다(토큰 절약)
workers: 6
max_retries: 4
price_per_mtok:                 # 비용 계산용(USD). claude_model 을 바꾸면 같이 바꾼다
  input: 4.0
  output: 20.0
# 검증셋에서는 가장 넓은 구간을 한 번만 묻고, 그 안의 작은 구간들은 저장한 답으로 다시 계산한다
widest_zone: [0.05, 0.9]
zone_lo: [0.05, 0.1, 0.15, 0.2, 0.25]
zone_hi: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
# 구간 고르는 규칙(검증셋 결과를 보기 전에 정함): 순이득(fix - break) 최대,
# 같으면 호출 수가 적은 쪽, 그래도 같으면 좁은 쪽
select_rule: net_gain
seed_cache_from: m3             # runs/m3/claude_cache.jsonl 을 복사해 쓴다(원본은 그대로)
